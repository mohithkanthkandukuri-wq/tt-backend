server.port=8082

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lost_found_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# File Upload Multipart Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Application Custom Properties
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f4c8b2d0e9a7c5b3a1f8e6d4c2b0a9f7e5d3c1b0a8f6e4d2b}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
